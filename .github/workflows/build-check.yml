name: Build check (PRs)

# Test-compiles pull requests into master without shipping anything.
on:
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Backend — install + syntax check
        run: |
          cd backend
          npm ci --omit=dev
          node --check server.js
          node --check controllers/sitemapController.js
          node --check routes/sitemap.js

      - name: Frontend — install + build
        run: |
          cd frontend
          npm ci
          npx vite build
